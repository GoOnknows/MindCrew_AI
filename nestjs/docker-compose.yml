version: '3.8'

services:
  # ─── PostgreSQL 数据库 ───
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: mindcrew-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mindcrew
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # ─── Redis 缓存 ───
  redis:
    image: redis:7-alpine
    container_name: mindcrew-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ─── Milvus 向量数据库 (standalone) ───
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: mindcrew-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcddata:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: mindcrew-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: mindcrew-milvus
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - '19530:19530'
      - '9091:9091'
    volumes:
      - milvusdata:/var/lib/milvus
    restart: unless-stopped
    command: milvus run standalone

volumes:
  pgdata:
  redisdata:
  etcddata:
  miniodata:
  milvusdata:
